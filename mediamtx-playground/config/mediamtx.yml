paths:
  # Source H265 RTSP stream read by Go app.
  h265src:
    runOnInit: ffmpeg -re -stream_loop -1 -i /config/video.h265.mp4 -c copy -f rtsp rtsp://localhost:8554/h265src
    runOnInitRestart: yes
  h265src2:
    runOnInit: ffmpeg -re -stream_loop -1 -i /config/video2.h265.mp4 -c copy -f rtsp rtsp://localhost:8554/h265src2
    runOnInitRestart: yes
  h264src:
    runOnInit: ffmpeg -re -stream_loop -1 -i /config/video.h264.mp4 -c copy -f rtsp rtsp://localhost:8554/h264src
    runOnInitRestart: yes
  h264src2:
    # video2.h264.mp4 has an irregular keyframe interval (up to ~10s between
    # IDRs), which makes GOP-aligned HLS segments balloon in size. Re-encode
    # with a fixed 2s GOP (48 frames @ 24fps) instead of -c copy so segments
    # stay small and consistent.
    runOnInit: ffmpeg -re -stream_loop -1 -i /config/video2.h264.mp4 -c:v libx264 -g 48 -keyint_min 48 -sc_threshold 0 -c:a copy -f rtsp rtsp://localhost:8554/h264src2
    runOnInitRestart: yes

  # Destination stream. Published by Go app via SRT.
  # Play it via:
  # - RTSP: ffplay "rtsp://localhost:8554/target" "-fflags" "nobuffer" "-probesize" "32" "-analyzeduration" "0"
  # - SRT:  ffplay "srt://localhost:8890?streamid=read:target" "-fflags" "nobuffer" "-probesize" "32" "-analyzeduration" "0"
  # The playback will not be complete before the first key frame. This is not an error.
  # You can validate the Go app with an alternative solution:
  # ffmpeg -i "rtsp://localhost:8554/h265src" -rtsp_transport tcp -c copy "srt://localhost:8890?streamid=publish:target"
  target:
    source: publisher
